<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CS2Nexus</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="bar">
  <a class="brand" href="/" id="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M6 22 16 6l10 16z" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/><circle cx="16" cy="18" r="2.6" fill="var(--t)"/></svg><span data-i18n="brand">CS2Nexus</span></a>
  <div class="bar-right">
    <select id="lang" class="lang" aria-label="Language" hidden></select>
    <a class="btn btn-primary" href="/login" id="loginBtn" data-i18n="nav.login">Log in</a>
    <div class="who" id="who" hidden>
      <button class="who-btn" id="whoBtn" aria-haspopup="true" aria-expanded="false"><span class="who-name" id="whoName"></span></button>
      <div class="who-menu" id="whoMenu" hidden><button class="link" id="logoutBtn" data-i18n="nav.logout">Log out</button></div>
    </div>
  </div>
</header>
<main id="app" class="page" aria-live="polite"></main>
<script src="/static/app.js"></script>
</body>
</html>
